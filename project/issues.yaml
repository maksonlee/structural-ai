- id: A01-004
  title: Code design actions
  status: OPEN
  detail: Verify current official rules and applicability, wind, earthquake, mass,
    combinations, pattern loads, torsion, stiffness and second-order assumptions.
- id: A01-005
  title: RC member design
  status: PARTIAL_SCOPED_ARTICLE_EXAMPLE
  detail: RC-001 checks one existing landing strip for direct gravity flexure, shear,
    minimum steel and spacing. Whole landing, beams, columns, walls, flights,
    joints, anchorage, seismic and full serviceability remain incomplete.
- id: A01-006
  title: Foundations
  status: OPEN
  detail: Create explicitly simulated ground conditions, compare appropriate foundation
    options, analyze/design and feed stiffness back to the superstructure.
- id: A01-007
  title: Lift / circulation requirements
  status: OPEN
  detail: Current geometry screens record 1.238 m nominal finished flights, uniform
    133.333 mm risers and a 1.28 m finished portal clear of B2. Pit and roof geometry
    are represented, but supplier-compatible lift clearances and reactions, rated
    doors, guards/rails, protected egress and discharge/accessibility remain open.
    Nominal dimensions and synthetic equipment inputs are not acceptance.
  evidence: architect/outputs/architectural-review.md
- id: A01-008
  title: Drawings and report
  status: OPEN
  detail: Current H03-C architectural and structural review sheets exist. Reinforcement
    schedules, foundation details and complete structural design drawings/calculations
    remain unfinished; article figures are diagnostic review outputs.
- id: A01-009
  title: Industry comparison
  status: OPEN
  detail: First Taiwan source review and stage matrix recorded; full comparison, recent
    matched project records, actual timings and independent practitioner review remain
