- id: A01-013
  title: Coordinated stair and landing load-transfer revision
  status: PARTIAL_DIAGNOSTIC_GRAVITY_REVISION_VERIFIED
  detail: H02 now derives released flight/landing reactions and first moments from
    source geometry, removes top bearing overlap, includes architectural stair finish
    load/mass and preserves nine load-only GUID records. Whole-building runs and drawings/quantities/trial-base
    reactions updated. Landing centroid and upper interface discrepancies are corrected;
    RC/anchorage, end restraint, stair bracing and ground-landing design remain open
    alongside A01-017.
  removed_historical_evidence: structural/outputs/deliverables/coordination-review-H02.md
  evidence_limit: Earlier output and its cleanup record are no longer retained;
    no new completion claim. Current evidence is indexed in structural/outputs/current.md.
- id: A01-014
  title: Local result convergence and design interpretation
  status: OPEN
  detail: Five H03-C 19-case/12-mode variants and ordinary CLI reproduction passed;
    109 nominal result files are identical. Twelve modes capture 93.39 percent X and
    81.73 percent Y free mass; code modal sufficiency and local force convergence
    remain open. Review signed section cuts, collectors, concentrated shell forces
    and effective stiffness before member design.
  evidence: structural/outputs/deliverables/structural-review.md
- id: A01-015
  title: Cost control basis and alternatives
  status: OPEN
  detail: Current analysis removes duplicated concrete accounting; this does not
    change physical concrete quantities or establish savings. The landing example
    compares ideal reinforcement-grid mass only. Establish comparable concrete,
    reinforcement and formwork quantities plus a dated cost basis, including laps,
    anchorage and waste. Budget and verified prices are absent; label synthetic
    assumptions and do not claim cost compliance or savings from solver timing.
- id: A01-016
  title: Construction feasibility review
  status: OPEN
  detail: Current review sheets identify wall/frame, stair, portal and lift/pit/roof
    interfaces; analytical rigid connections do not establish buildable joints.
    The landing sketch leaves anchorage and continuity on hold. Review congestion,
    laps, concrete placement, formwork, sequencing and site constraints with traceable
    details and attributable practice evidence. No contractor review or construction
    approval has occurred.
- id: A01-017
  title: Finished stair and lift/pit/roof interface revision
  status: OPEN_H03_C_GEOMETRY_ADOPTED_FINISHED_DETAILS_PENDING
  detail: H03-C geometry adopted for diagnostics and nominal core dimensions reviewed.
    Full protected egress, rated products, guard/rail details, WC/MEP and external
    architectural acceptance remain open. B2 clears the 1.28 m finished portal; equipment
    inputs are synthetic and now applied in diagnostics. Full foundations remain open.
  evidence: structural/outputs/deliverables/structural-review.md
- id: A01-018
  title: Floor and patch load first moments under mesh refinement
  status: CLOSED_SCOPED_H03_C_LOAD_RESULTANT_MAPPING
  detail: H03-C retains actual mesh station precision and integrates uniform net source-floor
    calibration area. All 19 force/position-moment resultants agree across 0.75/0.50
    m meshes within 3.64e-10 kNm for moments; independent patch/pressure tests pass.
    Earlier H02/H03-B drift and the failed first H03-C verification remain historical
    evidence. Local force convergence and code lateral distribution are separate open
    checks.
  evidence: structural/outputs/deliverables/structural-review.md
- id: A01-019
  title: Proposed core wall/frame/portal and foundation interfaces
  status: CLOSED_SCOPED_DIAGNOSTIC_INTERFACE_ADOPTION
  detail: All 31 wall/frame intersections have direct shared or eccentric rigid contact
    groups; 4.06848 m3 duplicated accounting is removed. Real-backend tests, five
    whole-building variants and ordinary CLI reproduction passed; current inputs and
    four review sheets are adopted together. Rigid joint flexibility assumptions,
    RC, anchorage and foundations remain open under A01-004/005/006/014/016.
  evidence: structural/outputs/deliverables/structural-review.md
