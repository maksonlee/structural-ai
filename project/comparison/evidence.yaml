policy:
  documented_workflow: Must cite an attributable source; product features alone do
    not establish how every firm works.
  measured_industry_effort: Requires matched project/task measurements or identified
    external evidence.
  numerical_equivalence: Requires matching model/assumptions and actual reference-software
    results.
  productivity_claim: Never infer a percentage from unsupported estimates or omit
    setup/debugging time.
  historical_chat_claims: Leads only; not verified evidence.
  taiwan_priority: Use dated Taiwan practitioner accounts and attributable project
    records for practice, official current sources for law, and local manuals for
    tool capability.
  opensees_or_ifc_adoption: A01 tool selection is a research choice, not evidence
    of widespread Taiwanese use.
  case_specific_model_decisions: Do not generalize A01 geometry constraints into universal
    design rules.
  no_synthetic_interviews: No invented company conversations, schedules, costs or
    survey percentages.
not_available:
- Matched ETABS model/results for A01
- Measured Taiwan firm effort for comparable tasks
- Independent practitioner review of A01
- Recent complete matched small-office design package
article_scope: Current case plus attributable practice/tool/regulatory evidence. Older
  case narrative rows removed with obsolete outputs; source-register review history
  remains.
