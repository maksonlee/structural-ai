owner: Project research / AI-assisted evidence collection
completion_policy: Progress the simulated project with explicit assumptions; do not
  turn unverified industry/legal claims into facts.
article_stage_update: RC-001 adds selected current concrete-code clauses, an attributed
  drawing-note example and supplier bar dimensions. It does not close complete-package,
  firm-prevalence, matched-software, labour, procurement or construction-review gaps.
