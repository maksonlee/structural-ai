name: Software and numerical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  input-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install -c docs/requirements-linux-py314.txt -e '.[analysis,ifc-validation]'
      - run: python -m unittest discover -s tests -v
      - run: python -m structural_ai validate --project project
      - run: python scripts/review_public_files.py --tracked
      # These checks do not establish whole-building design or engineering approval.
