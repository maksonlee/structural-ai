  publisher: OpenSees / OpenSeesPy developers
  evidence_type: UPSTREAM_TOOL_DOCUMENTATION
  checked_on: '2026-09-13'
  version_reviewed: OpenSees v3.8.0 source; live OpenSeesPy documentation (whose page
    header still says 3.5.1.3)
  url: https://openseespydoc.readthedocs.io/en/latest/src/elasticBeamColumn.html
  related_urls:
  - https://openseespydoc.readthedocs.io/en/latest/src/LinearTransf.html
