- id: tw-practitioner-ntu-2022
  title: 'Structural design practice: interview with a Jian-Ju structural engineer'
  original_title: 【十年後，他們在做什麼？】(EP04) 家業和興趣結合！我的結構設計之路
  publisher: National Taiwan University, Department of Civil Engineering, Du Feng
    newsletter
  author: Huang Zi-Huan (黃子桓), B98; interview with structural engineer Yang Xun-Hong
    (楊巽閎), Jian-Ju (建巨)
  url: https://www.ntuce-newsletter.tw/archives/11896
  publication_year: 2022
  date_evidence_url: https://www.ntuce-newsletter.tw/archives/category/173%E6%9C%9F
  evidence_type: ATTRIBUTED_PRACTITIONER_INTERVIEW
  locator: 'Interview sections 1-3: construction experience, design work sequence,
    architectural requests, beam/column reinforcement interfaces and drawing-team
    responsibilities'
  use: Consultant work sequence and division of responsibilities; re-reviewed for
    H01 handoff and construction-interface scope
  limitations: One practitioner account; not a current industry census. Do not use
    its historical review-threshold sidebar as current law.
