- id: taiwan-design-construction-2026
  title: Building Technical Regulations - Design and Construction Part, current intake
    clauses
  original_title: 建築技術規則建築設計施工編
  publisher: Ministry of the Interior; MOJ consolidated legal database and NLMA
  url: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070115
  related_urls:
  - https://www.nlma.gov.tw/ch/legislation/regsearch/6175
  - https://www.moi.gov.tw/News_Content.aspx?n=145&s=337030
  amended_on: '2026-02-23'
  latest_amendment_effective_on: '2026-07-01'
  checked_on: '2026-09-13'
  evidence_type: OFFICIAL_REGULATION
  locator: Articles 1(19), 33-35, 69, 89-98, 140-142, 167 through 167-3; edition header
  reviewed_via: Direct MOJ/NLMA HTML; MOJ Article 170 attached table PDF page 3 also
    inspected
  use: Intake applicability and stair dimensional scenarios, fire/discharge/accessibility
    interfaces and basement intent screening.
  limitations: Consolidation cutoff shown as 2026-09-04; Article 301 has separate
    pending commencement. The July amendment concerns civil-defence provisions, not
    new stair dimensions. No complete Taipei permit, land-use, fire or access approval.
  access_notes: Gazette wrapper returned an internal error; the current operative
    civil-defence text was read in MOJ instead. NLMA general history page alone was
    insufficient to establish the current edition.
  h02_review: Articles 76, 90, 92, 93, 95 and 97 directly read as single-article HTML.
    The proposed private-office circulation is screened under the ordinary-use route
    branch; doors, protected enclosure and final all-point travel remain open.
- id: taiwan-accessibility-stairs-2020
  title: Accessible building facilities design specification, stair provisions
  original_title: 建築物無障礙設施設計規範
  publisher: Ministry of the Interior / NLMA
  url: https://www.nlma.gov.tw/ch/legislation/regsearch/927
  full_text_url: https://www.nlma.gov.tw/uploads/files/e9abb44ff171074d23a7d1d5ee35b4a4.pdf
  revised_on: '2019-01-04'
  effective_on: '2019-07-01'
  errata_on: '2020-05-11'
  checked_on: '2026-09-13'
  evidence_type: OFFICIAL_DESIGN_SPECIFICATION
  locator: Chapter 3 sections 303-306; PDF pages 32-43 / printed pages 26-37; 304.1
    spans PDF pages 37-38
  reviewed_via: Official version listing and linked full PDF text; H01/H02 figure
    retrieval was unsuccessful. H03-A visually reviewed selected current PDF figures;
    see h03_a_reviews below.
  use: Individual flight riser/tread/comfort screens and identification of turning,
    guarding, handrail and finish work.
  limitations: Not a complete accessibility audit. Inter-flight uniformity and finished
    details remain unresolved; the residential exception is not adopted for this office.
  access_notes: First linked-PDF fetch timed out; direct retry succeeded. Only selected
    clauses reviewed; PDF is not redistributed.
  h02_review: Sections 303-305 and 404-406 read as text; riser uniformity, door/rail
    turns, 1.50 m lift lobby and 0.90 m door/1.35 m cabin depth requirements considered.
    Local PDF download returned a 245-byte rejection page, recorded as failure; no
    bypass or figure verification claimed.
- id: tw-envision-coordination-service
  title: Structural consultant service scope - architectural collaboration, alternatives
    and construction
  original_title: 服務項目
  publisher: Envision / 築遠工程顧問有限公司
  author: Firm-authored service description
  url: https://www.envision-tw.com/service-1
