- id: openseespy-distribution-2026
  title: OpenSeesPy and OpenSeesPyLinux release metadata
  publisher: OpenSeesPy maintainers via PyPI
  evidence_type: UPSTREAM_DISTRIBUTION_METADATA
  url: https://pypi.org/project/openseespy/3.8.0.0/
  related_urls:
