- id: taiwan-structural-regulations
  title: Taiwan Building Technical Regulations - Structural Part
  url: https://www.nlma.gov.tw/ch/legislation/regsearch/6174
  checked_on: '2026-09-13'
  status: SELECTED_PROCEDURAL_CLAUSES_REVIEWED
  use: Design-deliverable and calculation-software process requirements
  evidence_type: OFFICIAL_REGULATION
  publisher: Ministry of the Interior / NLMA
  original_title: 建築技術規則建築構造編
  locator: Articles 5-8; Chapter 2 Article 64 considered for investigation applicability
  execution_review: '2026-09-13: official HTML Articles 1, 3, 5-8 re-opened for diagnostic-stage
    requirements; no filing/approval determination.'
  h02_review: Official HTML Articles 10-15 and 17, 20-23, 26 and 28 read for actual
    permanent weights, use-specific stair/live/partition loads, lift impact and patterned-load
    gaps. Article 23 elevator support impact is identified for later equipment reactions,
    not applied to an unknown vendor load.
  edition_basis: Current consolidated publisher HTML accessed on the review date;
    separate clause amendment dates not established here.
  reviewed_via: Official HTML text
  limitations: Not a complete audit of all structural rules. No inherited A01 numeric
    design input is validated by this research update.
- id: taiwan-concrete-code
  title: Taiwan concrete structural design code
  url: https://www.nlma.gov.tw/ch/legislation/regsearch/6874
  checked_on: '2026-09-13'
  status: EDITION_ERRATA_AND_SELECTED_MODELLING_CLAUSES_REVIEWED
  evidence_type: OFFICIAL_CODE_PUBLICATION
  publisher: Ministry of the Interior / NLMA
  original_title: 建築物混凝土結構設計規範
  locator: 'Publication history: 2023-08-10 revision effective 2024-01-01; 2024-02-19
    errata'
  reviewed_via: Official publication listing plus H03-C selected 6.3/6.9 PDF text
    and errata; see h03_c_reviews, not a complete code review
  use: Track applicable edition and errata before implementing individual checks
  limitations: Does not certify an existing calculation or establish completeness
    of the implementation.
  editorial_link_review:
    accessed: '2026-09-13'
    alternate_official_pdf: https://www.nlma.gov.tw/filesys/file/EMMA/c1130219-1.pdf
    locator: Cover page, revision/effective dates and errata notice
    reviewed_via: Official PDF text; separate errata PDF also opened
    access_limit: Listing returned HTTP 403 in the browser tool and empty HTML via
      direct retrieval; original code PDF timed out. Alternate PDF cover verified
      the stated edition. This link review did not repeat the full clause audit.
  landing_strip_review:
    accessed: '2026-09-13'
    pdf_url: https://www.nlma.gov.tw/uploads/files/011d9249cac7d6c5547786aa348e352a.pdf
    errata_url: https://www.nlma.gov.tw/uploads/files/40e4370d2726960efcc41074b2d99f53.pdf
    method: Official listing and selected PDF text; cover-table errata reviewed.
    locators: Table 5.3.1(a,b) p5-1; 7.6.1.1/7.6.3.1 pp7-4; 7.7.2/7.7.6
      pp7-6/8; Table 20.5.1.3.1 p20-14 and errata PDF p14; Tables 21.2.1/2
      pp21-1/3; 22.2.2.1/.4 pp22-2/3; 22.5.5.1(c)/.1/.3 pp22-8/9;
      24.3.2/.1 and 24.4.3 pp24-7/9; 25.2.1 p25-1.
    applicability: Selected indoor normal-weight fy420 nonprestressed one-way gravity strip.
    limitations: Full landing, seismic, continuity, anchorage, fire and serviceability remain unchecked.
- id: tw-rebar-dimensions
